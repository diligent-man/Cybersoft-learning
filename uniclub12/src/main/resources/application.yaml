spring:
    application:
        name: uniclub

    config:
        import: "optional:file:.env[.properties]"

    datasource:
        url: jdbc:mysql://localhost:${MYSQL_PORT}/${MYSQL_DATABASE}
        username: ${MYSQL_USER}
        password: ${MYSQL_PASSWORD}

    jpa:
        generate-ddl: true
        hibernate:
            ddl-auto: none

    devtools:
        restart:
            enabled: true
    servlet:
        multipart:
            max-file-size: 500MB
            max-request-size: 500MB
