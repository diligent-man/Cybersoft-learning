services:
    mysql:
        build:
            context: docker/mysql
            dockerfile: Dockerfile
            platforms:
                - "linux/amd64"
            tags:
                - "uniclub/mysql:1.0.0"

        container_name: uniclub_mysql

        environment:
            MYSQL_HOST: ${MYSQL_HOST}
            MYSQL_PORT: ${MYSQL_PORT}
            
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

        networks:
            - mysql

        ports:
            - "${MYSQL_PORT}:${MYSQL_PORT}"

        # volumes:
        #     - ~/docker_prototype/mysql:/var/lib/mysql

        restart: on-failure

        healthcheck:
            test: [ "CMD-SHELL", "/usr/bin/mysql --user=root --password=${MYSQL_ROOT_PASSWORD} --execute \"SHOW DATABASES;\" || exit 1" ]
            interval: 5s
            timeout: 3s
            retries: 3

        deploy:
            mode: global

            restart_policy:
                condition: on-failure
                delay: 5s
                window: 120s
                max_attempts: 3

            resources:
                limits:
                    cpus: "4"
                    memory: 4096M
                reservations:
                    cpus: "4"
                    memory: 2048M

    fe:
        build:
            context: docker/fe
            dockerfile: Dockerfile
            platforms:
                - "linux/amd64"
            tags:
                - "uniclub/fe:1.0.0"
            args:
                NODE_VERSION: 26.1.0

        container_name: uniclub_fe

#        environment:
#            FE_PORT: ${FE_PORT:-3979}

        ports:
            - "3979:3979"

        restart: on-failure

        deploy:
            mode: global

            restart_policy:
                condition: on-failure
                delay: 5s
                window: 120s
                max_attempts: 3

            resources:
                limits:
                    cpus: "2"
                    memory: 2048M
                reservations:
                    cpus: "2"
                    memory: 2048M

    redis:
        image: redis:8.8.1-alpine
        container_name: uniclub_redis
        environment:
            REDIS_PORT: ${REDIS_PORT}
        ports:
            - "${REDIS_PORT}:${REDIS_PORT}"
        command:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - ${REDIS_PASSWORD}
        networks:
            - mysql
            - redis
        restart: on-failure
#        volumes:
#            - redis:/data
        deploy:
            mode: global

            restart_policy:
                condition: on-failure
                delay: 5s
                window: 120s
                max_attempts: 3

            resources:
                limits:
                    cpus: "2"
                    memory: 2048M
                reservations:
                    cpus: "2"
                    memory: 2048M

    redisinsight:
        image: redis/redisinsight:3.8
        container_name: uniclub_redisinsight
        environment:
            REDIS_UI_PORT: ${REDIS_UI_PORT}
        ports:
            - "${REDIS_UI_PORT}:${REDIS_UI_PORT}"
        restart: on-failure
        volumes:
            - redisinsight:/data
        networks:
            - redis
volumes:
    redisinsight:
networks:
    mysql:
        driver: bridge
    redis:
        driver: bridge
