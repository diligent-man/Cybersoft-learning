name: book_store_authtication
services:
    mysql:
        image: bookstore_authentication/mysql:1.0.0
        container_name: bookstore_authentication_mysql
        environment:
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        networks:
            - mysql
        ports:
            - "${MYSQL_PORT}:3306"
        volumes:
            - mysql:/var/lib/mysql
        restart: on-failure
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        deploy:
            mode: global
            restart_policy:
                condition: on-failure
                delay: 5s
                window: 120s
                max_attempts: 3
            resources:
                limits:
                    cpus: "4"
                    memory: 4096M
                reservations:
                    cpus: "4"
                    memory: 2048M

volumes:
    mysql:
        driver: local
        labels:
            com.ndt.capstone.description: "Backend Database"

networks:
    mysql:
        driver: bridge
